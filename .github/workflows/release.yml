name: Release

on:
  push:
    tags:
      - "*"
  # lets interface-update.yml start a release for the tag it just pushed
  # (a tag pushed with GITHUB_TOKEN doesn't trigger the push event)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check release metadata
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] \
            || { echo "::error::Run this workflow on a tag, not a branch"; exit 1; }
          ver="${GITHUB_REF_NAME#v}"
          ver_re=$(printf '%s' "$ver" | sed 's/\./\\./g')
          grep -qE '^## X-Curse-Project-ID: *[0-9]+' GCDBar.toc \
            || { echo "::error::Add ## X-Curse-Project-ID to GCDBar.toc"; exit 1; }
          grep -qE "^## Version: *v?${ver_re}[[:space:]]*$" GCDBar.toc \
            || { echo "::error::GCDBar.toc ## Version doesn't match tag ${ver}"; exit 1; }
          grep -qE "^## ${ver_re}[[:space:]]*$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## ${ver}' entry"; exit 1; }
      - uses: BigWigsMods/packager@v2
